<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizrok Workflow Intelligence Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
            },
            dark: {
              bg: '#090d16',
              sidebar: '#0d1322',
              card: '#151d30',
              border: '#222f47',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/app.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body class="bg-dark-bg text-slate-100 min-h-screen font-sans antialiased overflow-x-hidden selection:bg-sky-500 selection:text-white">
  
  <!-- Main Desktop App Shell -->
  <div class="flex h-screen overflow-hidden">
    
    <!-- Left Desktop Sidebar -->
    <aside class="w-72 bg-dark-sidebar border-r border-dark-border flex flex-col justify-between shrink-0 shadow-2xl z-20">
      <div>
        <!-- App Titlebar & Logo -->
        <div class="px-5 py-5 border-b border-dark-border flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-xl font-bold shadow-lg shadow-sky-500/20 text-white">
            ⚡
          </div>
          <div>
            <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-1.5" id="app-header-title">
              Workflow Studio <span class="px-1.5 py-0.5 text-[10px] uppercase font-semibold bg-sky-500/20 text-sky-400 rounded-md border border-sky-500/30" id="app-header-version">v1.0</span>
            </h1>
            <p class="text-xs text-slate-400 font-medium">AST Code Intelligence Studio</p>
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)] custom-scrollbar">
          <button class="nav-item active flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="overview">
            <span class="text-base">📊</span> Overview & Metrics
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="report">
            <span class="text-base">📜</span> Executive Report
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="diagrams">
            <span class="text-base">📐</span> Diagram Flow View
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="execution">
            <span class="text-base">🔄</span> End-to-End Workflows
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="customer">
            <span class="text-base">🌐</span> Customer Website
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="admin">
            <span class="text-base">🎛️</span> Admin Panel
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="backend">
            <span class="text-base">⚙️</span> Backend Modules
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="database">
            <span class="text-base">🗄️</span> Database & Entities
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="live-db">
            <span class="text-base">💾</span> Live Database Explorer
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="apis">
            <span class="text-base">🔌</span> GraphQL & APIs
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="security">
            <span class="text-base">🔐</span> Security & RBAC Audit
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="config">
            <span class="text-base">⚙️</span> System Config & Tech Info
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="debug">
            <span class="text-base">🧪</span> Live Debug & AST Console
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="issues">
            <span class="text-base">⚠️</span> Issues Report
          </button>
          <button class="nav-item flex items-center gap-3 w-full px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white transition-all text-left" data-tab="support">
            <span class="text-base">🤝</span> Support & Dev Guide
          </button>
        </nav>
      </div>

      <!-- Footer Info -->
      <div class="px-5 py-4 border-t border-dark-border text-xs text-slate-400 flex items-center justify-between">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Offline Ready
        </span>
        <span class="font-mono text-[11px] text-slate-400">AST Engine</span>
      </div>
    </aside>

    <!-- Main Workspace Content Panel -->
    <main class="flex-1 flex flex-col min-w-0 bg-dark-bg">
      
      <!-- Top Software Header / Bar -->
      <header class="h-16 px-6 border-b border-dark-border bg-dark-bg/80 backdrop-blur-md flex items-center justify-between gap-4 sticky top-0 z-10">
        <!-- Search Input -->
        <div class="relative flex-1 max-w-md">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
            🔍
          </span>
          <input type="text" id="global-search" class="w-full pl-9 pr-4 py-2 bg-slate-900/90 border border-dark-border rounded-xl text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all" placeholder="Search 75 pages, 318 APIs, 72 tables, services...">
        </div>

        <!-- Quick Metrics Badges & Window Actions -->
        <div class="flex items-center gap-3">
          <span class="px-3 py-1 text-xs font-semibold rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Live Observer
          </span>
          <button onclick="window.printReport && window.printReport()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition-all flex items-center gap-1.5">
            🖨️ PDF Report
          </button>
        </div>
      </header>

      <!-- Main Body Scroll Container -->
      <div class="flex-1 p-8 overflow-y-auto custom-scrollbar" id="tab-content">
        <div class="flex items-center justify-center h-64 text-slate-400 font-medium">
          Loading Workflow Intelligence Studio...
        </div>
      </div>
    </main>
  </div>

  <script src="generated/project-map.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
